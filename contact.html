<main id="main">
  <div class="hero small">
    <div class="wrap">
      <span class="eyebrow">联系我们</span>
      <h1>欢迎联系我们</h1>
      <p>告诉我们您的项目需求，我们会为您提供专属报价。</p>
    </div>
  </div>

  <section>
    <div class="wrap">
      <div class="contacts">
        <div><b>微信</b><span>待填写</span></div>
        <div><b>电话</b><span>待填写</span></div>
        <div><b>邮箱</b><span>待填写</span></div>
      </div>

      <form class="panel" id="contactForm" novalidate style="max-width:640px">
        <div class="field"><label for="f-name">姓名 *</label><input id="f-name" name="name" type="text" autocomplete="name" required></div>
        <div class="field"><label for="f-email">邮箱 *</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
        <div class="field"><label for="f-msg">留言 *</label><textarea id="f-msg" name="message" required></textarea></div>
        <button class="btn-main" type="submit">提交</button>
        <p id="formMsg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>
</main>
